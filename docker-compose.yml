services:
  nuva-bot:
    build: .
    container_name: nuva-monitoring-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # uncomment to edit config without rebuilding:
      # - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

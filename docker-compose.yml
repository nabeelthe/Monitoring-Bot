services:
  nuva-bot:
    build: .
    container_name: nuva-monitoring-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "8088:8088"   # dashboard · /healthz · /metrics
    volumes:
      # named volume: keeps the image's non-root ownership so state persists
      - botdata:/app/data
      # uncomment to edit config without rebuilding:
      # - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  botdata:

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -U pip setuptools wheel
          pip install -r requirements.txt pytest
      - name: Compile check
        run: python -m compileall -q nuva_bot
      - name: Validate shipped config
        run: python -m nuva_bot --check-config
      - name: Run tests
        run: pytest tests/ -q
